<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cataratas New Wave - Premios</title>

  <link rel="stylesheet" href="styles.css" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

  <div class="overlay">

    <header class="hero">

      <div class="logo-box">
        <h1 class="title">
          🎰 CATARATAS<br>
          <span>NEW WAVE</span>
        </h1>

        <p class="subtitle">
          Premios disponibles
        </p>
      </div>

    </header>

    <section class="info-bar">

      <div class="info-card">
        <span>🎯</span>
        Puntos acumulables
      </div>

      <div class="info-card">
        <span>🏆</span>
        Grandes premios
      </div>

      <div class="info-card">
        <span>📱</span>
        Escanea el QR
      </div>

    </section>

    <section class="search-container">

      <input
        type="text"
        id="buscador"
        placeholder="🔎 Buscar premio..."
      >

    </section>

    <section id="premios-list" class="premios"></section>

    <footer class="footer">

      <p>
        ⚠️ Premios sujetos a disponibilidad y fin de existencias
      </p>

    </footer>

  </div>

  <script src="script.js"></script>

</body>
</html>
